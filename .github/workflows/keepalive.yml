name: Mantener TingoCargo disponible

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar disponibilidad
        run: |
          curl --fail --silent --show-error --max-time 60 https://tingocargo-api.onrender.com/api/health
          curl --fail --silent --show-error --max-time 60 -X POST https://tingocargo-api.onrender.com/api/health/ping
