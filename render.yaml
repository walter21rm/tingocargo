# Blueprint de Render: API Node + sitio estático, ambos en plan gratuito.
# Base de datos: Supabase (ya existente). Configurar DATABASE_URL en el dashboard.

services:
  - type: web
    name: tingocargo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_DB
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DNI_API_URL
        sync: false
      - key: DNI_API_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://tingocargo-web.onrender.com
      - key: BACKEND_URL
        value: https://tingocargo-api.onrender.com
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: INACTIVIDAD_MINUTOS
        value: "30"

  - type: cron
    name: tingocargo-keepalive
    runtime: node
    plan: free
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: npm install
    startCommand: node scripts/keepalive.js
    envVars:
      - key: HEALTH_URL
        value: https://tingocargo-api.onrender.com/api/health
      - key: AVAILABILITY_URL
        value: https://tingocargo-api.onrender.com/api/health/ping

  - type: cron
    name: tingocargo-backup
    runtime: node
    plan: free
    rootDir: backend
    schedule: "0 8 * * *"
    buildCommand: npm install
    startCommand: node scripts/backup-db.js
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: tingocargo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
